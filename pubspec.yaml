name: hvad_nu
description: Audio-first interactive storytelling for children (ages 4-5) in Danish.
publish_to: 'none'
version: 1.0.0+1

environment:
  # 3.3 is the floor for `dart:js_interop`, used by lib/config/api_config_web.dart
  # to read the API keys injected into window.apiConfig on web.
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Camera & Media
  camera: ^0.10.5+9
  image: ^4.1.3

  # Audio
  just_audio: ^0.9.36
  record: ^5.0.4
  audio_session: ^0.1.18

  # Networking
  dio: ^5.4.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  uuid: ^4.2.2
  intl: ^0.18.1
  flutter_dotenv: ^5.1.0
  path_provider: ^2.1.1
  permission_handler: ^11.1.0

  # UI
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mocktail: ^1.0.4
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/themes/
    - assets/audio/
    - .env
